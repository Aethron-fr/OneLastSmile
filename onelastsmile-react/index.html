  <body>
<div id="mobileWarning" style="display: none;">
  <div id="mobileWarningCard">
    <div id="mobileWarningHeart">💕</div>
    <h2 id="mobileWarningTitle">Made for a Bigger Screen</h2>
    <p id="mobileWarningText">
      This was built with love, late nights, and a lot of 
      detail — best experienced on a laptop or desktop.<br><br>
      On mobile, some magic might be lost.
    </p>
    <div id="mobileWarningButtons">
      <button onclick="closeMobileWarning()" id="btnContinueMobile">
        Continue Anyway 🌸
      </button>
      <p id="mobileWarningHint">
        (For the full experience, open on desktop)
      </p>
    </div>
  </div>
</div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      function closeMobileWarning() {
        const el = document.getElementById('mobileWarning');
        if (el) {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.5s ease';
          setTimeout(() => el.style.display = 'none', 500);
        }
      }

      // Auto-show only on mobile
      window.addEventListener('DOMContentLoaded', () => {
        if (window.innerWidth <= 768) {
          const el = document.getElementById('mobileWarning');
          if (el) el.style.display = 'flex';
        }
      });
    </script>
  </body>
</html>
